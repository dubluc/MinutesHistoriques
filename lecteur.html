<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lecteur audio | Minutes historiques de Québec</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;padding:4px;background:transparent;font-family:Arial,sans-serif;color:#202124}
#mini-player{display:flex;align-items:center;justify-content:flex-end;gap:6px;width:100%;min-height:34px;flex-wrap:wrap}
button,select{font-family:inherit}
#play{width:27px;height:27px;flex:0 0 27px;padding:0;border:0;border-radius:50%;background:#1976d2;color:white;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#play:hover{background:#125ea7}
#restart{width:22px;height:22px;flex:0 0 22px;padding:0;border:0;border-radius:50%;background:transparent;color:#5f6368;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#restart:hover{color:#1976d2;background:#f1f3f4}
#time{color:#777;font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.speed{display:flex;align-items:center;gap:5px;color:#5f6368;font-size:12px;white-space:nowrap}
#speed{border:1px solid #dadce0;background:white;color:#202124;border-radius:4px;padding:2px 4px;font-size:12px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid #1976d2;outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
#status{width:100%;text-align:right;color:#a32929;font-size:11px;min-height:0}
@media(max-width:340px){#mini-player{gap:4px}.speed{gap:3px}}
</style>
</head>
<body>
<div id="mini-player" aria-label="Lecteur audio des Minutes historiques">
<button id="play" type="button" aria-label="Lecture" title="Lecture / Pause" disabled>▶</button>
<button id="restart" type="button" aria-label="Recommencer" title="Recommencer" disabled>↺</button>
<span id="time" aria-live="off">0:00 / 0:00</span>
<div class="speed"><label for="speed">Vitesse :</label>
<select id="speed"><option value="0.75">0,75×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="1.75">1,75×</option><option value="2">2×</option></select></div>
<div id="status" role="status" aria-live="polite"></div>
<audio id="audio" preload="metadata"></audio>
</div>
<script>
(()=>{
'use strict';
const BASE='https://raw.githubusercontent.com/dubluc/MinutesHistoriques/main/';
const audio=document.getElementById('audio');
const play=document.getElementById('play');
const restart=document.getElementById('restart');
const time=document.getElementById('time');
const speed=document.getElementById('speed');
const status=document.getElementById('status');
const params=new URLSearchParams(window.location.search);
const requested=(params.get('audio')||'').trim();
const format=n=>Number.isFinite(n)&&n>=0?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
const updateTime=()=>{time.textContent=format(audio.currentTime)+' / '+format(audio.duration)};
const updateButton=()=>{play.textContent=audio.paused?'▶':'❚❚';play.setAttribute('aria-label',audio.paused?'Lecture':'Pause')};
function fail(message){status.textContent=message;play.disabled=true;restart.disabled=true;updateButton()}
// Accept a filename, not a path or arbitrary external URL.
if(!requested){fail('Aucun fichier audio indiqué. Ajoutez ?audio=NomDuFichier.mp3 à l’URL.');return}
if(requested.includes('/')||requested.includes('\\')||requested==='.'||requested==='..'||!requested.toLowerCase().endsWith('.mp3')){
 fail('Nom de fichier MP3 invalide.');return;
}
audio.src=BASE+encodeURIComponent(requested);
play.disabled=false;restart.disabled=false;
audio.playbackRate=Number(speed.value);
audio.addEventListener('loadedmetadata',()=>{status.textContent='';updateTime()});
audio.addEventListener('durationchange',updateTime);
audio.addEventListener('timeupdate',updateTime);
audio.addEventListener('play',updateButton);
audio.addEventListener('pause',updateButton);
audio.addEventListener('ended',()=>{audio.currentTime=0;updateTime();updateButton()});
audio.addEventListener('error',()=>fail('Impossible de charger le fichier audio. Vérifiez son nom sur GitHub.'));
play.addEventListener('click',async()=>{if(!audio.paused){audio.pause();return}try{await audio.play();status.textContent=''}catch(e){status.textContent='Lecture impossible. Vérifiez le fichier ou les permissions du navigateur.'}});
restart.addEventListener('click',()=>{audio.currentTime=0;updateTime()});
speed.addEventListener('change',()=>{audio.playbackRate=Number(speed.value)});
})();
</script>
</body>
</html>
